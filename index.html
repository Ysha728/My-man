
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JUST SAY NO 😈</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffe4ef;
      font-family: Arial, sans-serif;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      color: #be185d;
      padding: 15px;
    }

    #noButton {
      background: #ec4899;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 18px 45px;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.25s ease;
      max-width: 95vw;
      max-height: 65vh;
    }

    #message {
      color: #9d174d;
      font-size: 20px;
      font-weight: bold;
      padding: 15px;
    }
  </style>
</head>

<body>
  <h1 id="title">DO YOU LOVE ME? 💗</h1>

  <button id="noButton" onclick="grow()">
    NO 😈
  </button>

  <p id="message">Go ahead. Press NO. 🤨</p>

  <script>
    let clicks = 0;

    function grow() {
      clicks++;

      const button = document.getElementById("noButton");
      const message = document.getElementById("message");
      const title = document.getElementById("title");

      const size = Math.min(24 + clicks * 8, 100);

      button.style.fontSize = size + "px";
      button.style.padding =
        Math.min(18 + clicks * 10, 100) + "px " +
        Math.min(45 + clicks * 15, 140) + "px";

      const messages = [
        "HAHAHA PRESS IT AGAIN 😭",
        "WHY ARE YOU STILL PRESSING IT?! 💀",
        "THE NO BUTTON IS EVOLVING 😈",
        "BRO, IT'S GETTING BIGGER 😂",
        "YOU CANNOT ESCAPE THE NO 😭",
        "OKAY, THIS BUTTON OWNS THE SCREEN NOW 💗"
      ];

      message.textContent =
        messages[Math.min(clicks - 1, messages.length - 1)];

      if (clicks >= 4) {
        title.textContent = "ARE YOU HAPPY NOW?! 😭";
      }

      if (clicks >= 8) {
        button.textContent = "STILL NO?! 💀";
      }

      if (clicks >= 12) {
        button.style.width = "95vw";
        button.style.height = "55vh";
        button.textContent = "NO NO NO 😈";
      }
    }
  </script>
</body>
</html>
